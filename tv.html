<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランダムYoutube</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <iframe id="frame" title="再生中の動画" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>

  <div id="screen" class="screen">
    <h1>ランダムYoutube</h1>
    <p id="message"></p>
    <p id="slot" class="slot"></p>
    <div class="actions">
      <button id="power" type="button">放送開始</button>
      <button id="settings" type="button" class="ghost">設定</button>
    </div>
  </div>

  <div id="bar" class="bar" hidden>
    <span id="info"></span>
    <button id="skip" type="button">次へ ▶</button>
    <button id="barSettings" type="button" class="ghost">設定</button>
  </div>

  <script type="module" src="tv.js"></script>
</body>
</html>
