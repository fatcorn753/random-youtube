<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランダムYoutube 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>設定</h1>

    <section>
      <h2>YouTube Data API キー</h2>
      <p class="note">
        キーはこのブラウザ内にだけ保存されます。取得手順は
        <a href="https://developers.google.com/youtube/v3/getting-started" target="_blank" rel="noreferrer">公式ドキュメント</a>
        を参照してください（YouTube Data API v3 を有効にし、キーの API 制限もそれだけにするのがおすすめです）。
      </p>
      <div class="row">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza...">
        <button id="saveKey" type="button">保存して確認</button>
      </div>
      <p id="keyStatus" class="status" role="status"></p>
    </section>

    <section>
      <h2>流す国</h2>
      <p class="note">選べるのは国だけです。動画は選べません。選んだ国をすべて等しい確率で抽選します。</p>

      <div class="row">
        <input id="search" type="search" placeholder="国名で絞り込み" aria-label="国名で絞り込み">
      </div>

      <div class="row wrap" id="bulk">
        <button type="button" id="selectAll">全選択</button>
        <button type="button" id="clearAll" class="ghost">全解除</button>
        <span class="sep"></span>
        <span id="groups" class="row wrap"></span>
      </div>

      <p id="count" class="status" role="status"></p>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
